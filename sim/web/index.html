<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nông trang ảo VIA Cốm</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f5; font-family: system-ui, sans-serif; }
  #view { position: absolute; inset: 0; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(20, 30, 20, .78); color: #f2f6ee;
         padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 300px; }
  #hud b { color: #c8e68c; }
  #hud .ok { color: #9be27a; } #hud .off { color: #ffb37a; }
  #cam { position: absolute; right: 12px; top: 12px; border: 3px solid #fff; border-radius: 8px;
         width: 320px; height: 240px; background: #000; image-rendering: pixelated; }
  #camlabel { position: absolute; right: 12px; top: 262px; color: #1d2a1d; font-size: 12px;
              background: rgba(255,255,255,.8); padding: 2px 8px; border-radius: 6px; }
  @media (max-width: 760px) { #cam { width: 160px; height: 120px; } #camlabel { top: 142px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="cam" width="320" height="240"></canvas>
<div id="camlabel">Camera của robot (ảnh gửi cho chương trình)</div>
<div id="hud">
  <img src="./favicon.png" alt="" width="22" height="22" style="vertical-align:-5px;margin-right:4px"><b>Nông trang ảo VIA Cốm</b> · <span id="mapname"></span><br>
  Kết nối: <span id="ws" class="off">chưa có chương trình điều khiển</span><br>
  Vị trí: <span id="pose">–</span><br>
  Tốc độ: <span id="vel">–</span> · Quả thấy được: <span id="nlabels">0</span><br>
  Phím: <b>W A S D</b> lái tay · <b>C</b> đổi góc nhìn · <b>R</b> về vị trí đầu
</div>
<script type="module" src="./farm.js"></script>
</body>
</html>
